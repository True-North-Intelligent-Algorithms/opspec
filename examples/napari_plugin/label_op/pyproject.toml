[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "label-op"
version = "0.1.0"
description = "One op, as a napari plugin."
requires-python = ">=3.10"
dependencies = ["opspec", "scikit-image", "example-runner"]

[project.entry-points."napari.manifest"]
label-op = "label_op:napari.yaml"

[tool.hatch.build.targets.wheel]
packages = ["src/label_op"]
